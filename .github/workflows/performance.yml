name: performance-diagnosis
on:
  push:
    branches: ["fix/lifecycle-protocol-reproducibility"]
    paths:
      - ".github/workflows/performance.yml"
      - "bench/diagnose/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: performance-diagnosis
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare an ephemeral Linux measurement VM
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wrk ripgrep python3
          mkdir -p build/performance
          uname -a | tee build/performance/uname.txt
          lscpu | tee build/performance/lscpu.txt
          cat /proc/sys/kernel/modules_disabled
          cat /sys/kernel/security/lockdown || true
          test -d "/lib/modules/$(uname -r)/build"
          make module
          modinfo khttpd.ko > build/performance/modinfo.txt
      - name: Measure current kernel implementation, 4 threads / 256 connections
        run: |
          set -euo pipefail
          cleanup() { sudo rmmod khttpd || true; }
          trap cleanup EXIT
          sudo insmod khttpd.ko workers=512 shards=1 keep_alive=1 prealloc=1 \
            max_requests=1000000 timeout_ms=5000
          wrk -t4 -c256 -d5s --latency --timeout 2s \
            -s bench/validate.lua http://127.0.0.1:8081/ \
            | tee build/performance/current-validated.txt
          wrk -t4 -c256 -d5s --latency --timeout 2s http://127.0.0.1:8081/ \
            | tee build/performance/current-plain.txt
          cat /sys/module/khttpd/parameters/stats | tee build/performance/current-stats.txt
          sudo rmmod khttpd
          trap - EXIT
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: performance-diagnosis
          path: build/performance/
