name: correctness

on:
  pull_request:
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  userspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang ripgrep python3 wrk
      - name: Shared engine and userspace integration
        run: make test
      - name: Exercise evidence capture with real wrk (not performance evidence)
        run: |
          read -r server_cpu client_cpu < <(python3 -c \
            'import os; c=sorted(os.sched_getaffinity(0)); print(c[0], c[1])')
          python3 bench/run.py --implementation userspace --single \
            --server-cpus "$server_cpu" --client-cpus "$client_cpu" \
            --threads 1 --connections 2 --workers 8 --duration 1 --warmup 0 \
            --repetitions 1 --output build/bench-smoke
          python3 bench/summarize.py build/bench-smoke
      - name: Address and undefined-behavior sanitizers
        run: make sanitize
      - name: Bounded parser fuzz smoke test
        run: |
          clang -std=c11 -g -O1 -fsanitize=fuzzer,address,undefined \
            tests/fuzz_protocol.c http_protocol.c -o build/fuzz
          ./build/fuzz -max_total_time=20 -max_len=8193
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: userspace-logs
          path: build/*.log
  kernel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install matching guest kernel and tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic \
            linux-image-generic busybox-static cpio qemu-system-x86 ripgrep
      - name: Build against guest headers
        run: |
          image=$(printf '%s\n' /boot/vmlinuz-*-generic | sort -V | tail -n 1)
          release=$(basename "$image")
          release=${release#vmlinuz-}
          make module KDIR="/lib/modules/$release/build"
          mkdir -p build
          sudo install -m 0644 "$image" build/vmlinuz
          printf '%s\n' "$release" > build/kernel-release.txt
          modinfo khttpd.ko > build/modinfo.txt
      - name: Protocol, partial-init and active-unload tests in QEMU
        run: ./scripts/ci-vm.sh "$PWD/build/vmlinuz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-${{ matrix.os }}
          path: |
            build/vm.log
            build/kernel-release.txt
            build/modinfo.txt
