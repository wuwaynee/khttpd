name: matched-feature-ablation
on:
  push:
    branches: ["fix/lifecycle-protocol-reproducibility"]
    paths: [".github/workflows/ablation.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: matched-feature-ablation
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare a fresh Linux measurement VM
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wrk ripgrep python3
          mkdir -p build/ablation
          uname -a | tee build/ablation/uname.txt
          lscpu | tee build/ablation/lscpu.txt
          make module
          make -C "/lib/modules/$(uname -r)/build" \
            M="$PWD/bench/diagnose/legacy" W=1 modules
      - name: Matched mechanism controls, three 10-second repetitions
        run: |
          python3 bench/diagnose/run.py --output build/ablation/matched \
            --duration 10 --warmup 2 --repetitions 3 \
            --profiles matched_close512,keepalive_logged512,keepalive_quiet512,legacy_optimized1,legacy_optimized4,legacy_no_pool,hardened1,hardened4,hardened_alloc,hardened_close
          python3 bench/diagnose/summarize.py build/ablation/matched
      - name: Kernel diagnostics on failure
        if: failure()
        run: sudo dmesg | tail -n 80
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: matched-feature-ablation
          path: build/ablation/
